<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="position.css">
</head>
<body>
    <!-- 
        Relative:
        - Bergeser Terhadap Posisi Semula
        - Bergeser Meninggalkan Celah
    -->
    <div id="box-relative-01">
        Box-01 
    </div>
    <div id="box-relative-02">
        Box-02 
    </div>
    <div id="box-relative-03">
        Box-03
    </div>



    <!-- 
        Absolute
        - Bergeser Terhadap Parent yang Memiliki 
          Position Non-Static
        - Bergeser Tidak Meninggalkan Celah Kosong
    -->
    <section style="position: relative; margin-top: 100px; margin-bottom: 100px; border: 1px solid black;">
        <div id="box-abs-01">
            Box-01 
        </div>
        <div id="box-abs-02">
            Box-02 
        </div>
        <div id="box-abs-03">
            Box-03 
        </div>
    </section>

    

    <!-- 
        Fixed
        - Berpindah Terhadap Viewport
    -->
    <section>
        <div id="nav">
            Nav 
        </div>
    </section>
</body>
</html>
