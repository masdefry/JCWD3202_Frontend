<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>
    <!-- 
        Flexbox: Menyusun element di dalam sebuah container

        Flexbox terdiri dari 2 komponen utama:
            - Flex Container – Elemen induk yang mengatur elemen di dalamnya
            - Flex Items – Elemen di dalam flex container yang diatur tata letaknya

        Property Flex:
            1. Flex Direction  : Menentukan Arah(Vertical/Horizontal)
            2. Justify Content : Mengatur Posisi Horizontal
            3. Align Items     : Mengatus Posisi Vertical
    -->
    <container id="container-01">
        <div id="itm-01"> Item-01 </div>
        <div id="itm-02"> Item-02 </div>
        <div id="itm-03"> Item-03 </div>
    </container>

    <nav>
        <div>
            Box-01 
        </div>
        <div>
            Box-02
        </div>
        <div>
            Box-03
        </div>
    </nav>
</body>
</html>
